<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#2f5488" />
  <title>Offline — VenueFlowHQ</title>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; min-height: 100dvh; display: flex; align-items: center; justify-content: center;
      padding: max(24px, env(safe-area-inset-top)) 24px max(24px, env(safe-area-inset-bottom));
      background: #fdfcf8; color: #1f2a37;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    main { max-width: 360px; text-align: center; }
    img { width: 72px; height: 72px; margin-bottom: 20px; }
    h1 { font-size: 22px; margin: 0 0 10px; }
    p { font-size: 16px; line-height: 1.5; margin: 0 0 22px; color: #4b5563; }
    button {
      font: inherit; font-weight: 600; min-height: 48px; padding: 0 28px; border: 0; border-radius: 8px;
      background: #2f5488; color: #fff; cursor: pointer;
    }
    button:focus-visible { outline: 3px solid #93b4e6; outline-offset: 2px; }
  </style>
</head>
<body>
  <main role="main">
    <img src="/icon-192.png" alt="" width="72" height="72" />
    <h1>You're offline</h1>
    <p>VenueFlow needs a connection to load this page. Check your signal or Wi-Fi, then try again.</p>
    <button type="button" onclick="location.reload()">Try again</button>
  </main>
  <script>
    // Come back by itself once the phone is online again.
    window.addEventListener('online', function () { location.reload(); });
  </script>
</body>
</html>
